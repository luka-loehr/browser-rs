[package]
name = "browser-mcp-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rmcp = { version = "3.1.4", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
wry = "0.56"
tao = "0.36"

[package]
name = "browser-mcp-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rmcp = { version = "3.1.4", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
wry = "0.56"
tao = "0.36"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSImage", "NSGraphics"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }
block2 = "0.6.2"
